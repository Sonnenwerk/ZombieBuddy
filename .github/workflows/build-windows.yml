name: Build Windows Executable

on:
  push:
    branches: [ "main", "fix/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build Executable
        working-directory: installer
        run: go build -o ZombieBuddyInstaller.exe

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: ZombieBuddy-Windows-Exe
          path: installer/ZombieBuddyInstaller.exe
